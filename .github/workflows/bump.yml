name: Bump formulas

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update formulas
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "version=$(scripts/bump.sh)" >> "$GITHUB_OUTPUT"
      - name: Audit and test
        if: steps.bump.outputs.version != ''
        run: |
          brew tap-new --no-git local/ci
          cp Formula/*.rb "$(brew --repository local/ci)/Formula/"
          brew install --formula local/ci/contour local/ci/contour-mcp
          brew test local/ci/contour local/ci/contour-mcp
      - name: Commit
        if: steps.bump.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "contour ${{ steps.bump.outputs.version }}"
          git push
